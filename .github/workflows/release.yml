name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish to npm again (for example v0.11.0)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release-npm:
    needs: release-please
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-latest
    # Trusted publishing: npm trusts this workflow's OIDC token, so no npm
    # token is stored. The package's trusted publisher on npmjs.com names
    # this repository and this file.
    permissions:
      id-token: write
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Use an npm that publishes with OIDC
        run: |
          npm install -g npm@latest
          npm --version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Run linter
        run: bun run lint

      - name: Run unit and integration tests with the count gate
        run: bun run test

      - name: Build
        run: bun run build

      - name: Verify build output
        run: |
          if [ ! -f dist/index.js ]; then
            echo "Build failed - dist/index.js not found"
            exit 1
          fi
          if ! head -n 1 dist/index.js | grep -q "#!/usr/bin/env node"; then
            echo "Build failed - shebang missing"
            exit 1
          fi

      - name: Smoke test the built CLI under Node.js
        run: bun run smoke:node

      - name: Check the tag matches package.json
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$RELEASE_TAG" ]; then
            echo "::error::package.json is $VERSION but the tag is $RELEASE_TAG"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --access public --provenance

  release-cli:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      - name: Check formatting
        run: bun run format:check

      - name: Run linter
        run: bun run lint

      - name: Run unit and integration tests with the count gate
        run: bun run test

      - name: Build CLI for all platforms
        run: bun run scripts/release.ts
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}

      - name: Upload binaries to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          shopt -s nullglob
          assets=(dist/targets/venfork-*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No binaries found in dist/targets/"
            exit 1
          fi
          gh release upload "$TAG" "${assets[@]}" --clobber