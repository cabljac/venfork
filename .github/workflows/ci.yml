name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Run linter
        run: bun run lint

      - name: Run unit tests
        run: bun run test:unit --reporter=junit --reporter-outfile=unit.xml

      - name: Check unit test count
        run: bun scripts/test-count.ts unit unit.xml

      - name: Run integration tests
        run: bun run test:integration --reporter=junit --reporter-outfile=integration.xml

      - name: Check integration test count
        run: bun scripts/test-count.ts integration integration.xml

      - name: Build
        run: bun run build

      - name: Verify build output
        run: |
          if [ ! -f dist/index.js ]; then
            echo "Build failed - dist/index.js not found"
            exit 1
          fi
          if ! head -n 1 dist/index.js | grep -q "#!/usr/bin/env node"; then
            echo "Build failed - shebang missing"
            exit 1
          fi
          echo "✓ Build verification passed"

      - name: Test CLI help
        run: node dist/index.js --help

  test-node:
    name: Test with Node.js
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Bun (for building)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test CLI help with Node.js ${{ matrix.node-version }}
        run: node dist/index.js --help

      - name: Run doctor against a local fixture with Node.js ${{ matrix.node-version }}
        run: bun run smoke:node
