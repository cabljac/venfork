name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run verify

      - name: Verify build output
        run: |
          if [ ! -f dist/index.js ]; then
            echo "Build failed - dist/index.js not found"
            exit 1
          fi
          if ! head -n 1 dist/index.js | grep -q "#!/usr/bin/env node"; then
            echo "Build failed - shebang missing"
            exit 1
          fi
          echo "✓ Build verification passed"

      - name: Test CLI help
        run: node dist/index.js --help

  test-node:
    name: Test with Node.js
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22, 24]
        npm: [bundled]
        include:
          - node-version: 22
            npm: latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Use npm@latest, as the release job does
        if: matrix.npm == 'latest'
        run: |
          npm install -g npm@latest
          npm --version

      - name: Setup Bun (for building)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test CLI help with Node.js ${{ matrix.node-version }}
        run: node dist/index.js --help

      - name: Run doctor against a local fixture with Node.js ${{ matrix.node-version }}
        run: bun run smoke:node
